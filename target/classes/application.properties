# ===================================
# Banco de dados — H2 in-memory
# Padrao BASE: Basically Available, Soft state, Eventually consistent
# ===================================
spring.datasource.url=jdbc:h2:mem:triagem
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2 acessivel em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===================================
# JPA / Hibernate (ORM)
# create-drop: schema criado ao iniciar, destruido ao parar (soft state)
# ===================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ===================================
# Swagger UI — springdoc-openapi
# Acessivel em http://localhost:8080/swagger-ui.html
# ===================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method
